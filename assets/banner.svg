<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <!-- Glowing animated text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #818CF8; #34D399; #38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8; #34D399; #F59E0B; #818CF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399; #F59E0B; #38BDF8; #34D399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.1); }
      }
      @keyframes strokeDash {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-2 { animation: floatFast 4.5s ease-in-out infinite; }
      .pulsing-orb { animation: pulseLight 4s ease-in-out infinite; transform-origin: center; }
      .animated-line {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: strokeDash 5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200 M0 360 H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="100" r="150" fill="#38BDF8" opacity="0.15" class="pulsing-orb" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="180" fill="#818CF8" opacity="0.12" class="pulsing-orb" filter="url(#glow)"/>

  <!-- Decorative Wave / Chart Lines in Background -->
  <path d="M 50,280 Q 250,180 450,260 T 850,200 T 1150,240" stroke="url(#lineGrad)" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 50,310 Q 300,220 550,290 T 950,230 T 1150,270" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6,6" fill="none" opacity="0.4"/>

  <!-- Left Side: Main Title & Subtitle -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="16" r="6" fill="#34D399" filter="url(#softGlow)"/>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="0.5">CURATED FINTECH STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" filter="url(#softGlow)">
      Awesome Loan Servicing Platform
    </text>

    <!-- Description -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94A3B8" font-weight="400">
      Open-Source Core Banking, Lending Engines, Accounting &amp; Servicing SaaS
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 145)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#E2E8F0">🏦 Core Banking</text>

      <!-- Tag 2 -->
      <rect x="150" y="0" width="140" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="162" y="18" font-family="sans-serif" font-size="12" fill="#E2E8F0">💳 Loan Ledgers</text>

      <!-- Tag 3 -->
      <rect x="300" y="0" width="160" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="312" y="18" font-family="sans-serif" font-size="12" fill="#E2E8F0">📊 Amortization Engines</text>
    </g>
  </g>

  <!-- Right Side: Graphic UI Cards -->
  <g transform="translate(780, 60)">
    <!-- Floating Card 1: Loan Overview -->
    <g class="floating-card-1">
      <rect x="0" y="20" width="340" height="190" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
      
      <!-- Card Header -->
      <circle cx="30" cy="50" r="14" fill="#38BDF8" opacity="0.2"/>
      <path d="M 25,50 L 29,54 L 35,46" stroke="#38BDF8" stroke-width="2" fill="none"/>
      <text x="54" y="55" font-family="sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Active Loan Portfolio</text>
      <text x="250" y="55" font-family="sans-serif" font-size="12" font-weight="600" fill="#34D399">+14.2%</text>

      <!-- Amount -->
      <text x="30" y="95" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">$24,850,000</text>
      <text x="30" y="115" font-family="sans-serif" font-size="12" fill="#64748B">Principal &amp; Interest Serviced</text>

      <!-- Progress Bar -->
      <rect x="30" y="135" width="280" height="8" rx="4" fill="#334155"/>
      <rect x="30" y="135" width="210" height="8" rx="4" fill="url(#lineGrad)"/>

      <!-- Footer stats -->
      <text x="30" y="165" font-family="sans-serif" font-size="11" fill="#94A3B8">Performing: 98.4%</text>
      <text x="200" y="165" font-family="sans-serif" font-size="11" fill="#94A3B8">Delinquency: 1.6%</text>
    </g>

    <!-- Floating Card 2: Repayment Status (Overlapping) -->
    <g class="floating-card-2" transform="translate(-40, 140)">
      <rect x="0" y="0" width="240" height="110" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5" filter="url(#glow)"/>
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Automated Repayments</text>
      <text x="20" y="60" font-family="sans-serif" font-size="20" font-weight="700" fill="#34D399">⚡ Apache Fineract</text>
      <text x="20" y="85" font-family="sans-serif" font-size="11" fill="#38BDF8">Frappe Lending • Formance</text>
    </g>
  </g>
</svg>
